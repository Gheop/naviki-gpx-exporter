name: Tests

# Rien de ce qui est ignoré ici n'entre dans l'image ni dans les tests.
# GitHub n'applique pas ces filtres aux tags : une release est toujours
# testée et publiée.
on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'bench/**'
      - 'LICENSE'
      - '.gitignore'
      - '.env.example'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'bench/**'
      - 'LICENSE'
      - '.gitignore'
      - '.env.example'

permissions:
  contents: read

# Un nouveau push sur une PR annule le run en cours ; sur main et les tags,
# aucun run n'est interrompu (pas de publication coupée en route)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Linting & Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: requirements*.txt
    
    # Mêmes outils et mêmes versions que le hook local
    - name: Lint and format check (pre-commit)
      run: |
        python -m pip install --upgrade pip pre-commit
        pre-commit run --all-files --show-diff-on-failure

  test:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        # Toutes les versions sur Linux ; la plus ancienne et la plus
        # récente seulement sur Windows et macOS
        exclude:
          - os: windows-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.13'
    
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements*.txt
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-test.txt
    
    - name: Run unit tests
      run: |
        pytest tests/ --cov=. --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: coverage.xml
        flags: ${{ matrix.os }}-py${{ matrix.python-version }}
        name: ${{ matrix.os }}-py${{ matrix.python-version }}
        token: ${{ secrets.CODECOV_TOKEN }}
        # Une PR venant d'un fork n'a pas accès au secret CODECOV_TOKEN
        fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}


  security:
    name: Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: requirements*.txt
    
    - name: Install pip-audit
      run: |
        python -m pip install --upgrade pip pip-audit

    # Audite les dépendances du projet (pas l'environnement du runner) et
    # échoue sur toute vulnérabilité connue
    - name: Run pip-audit
      run: |
        pip-audit -r requirements.txt --strict --desc
        pip-audit -r requirements-lock.txt --require-hashes --strict --desc

  # Build et scan sans attendre les tests : ils ne publient rien
  docker-scan:
    name: Docker scan
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      security-events: write

  docker-publish:
    name: Docker publish
    needs: [lint, test, security, docker-scan]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/docker.yml
    with:
      publish: true
    permissions:
      contents: read
      packages: write
