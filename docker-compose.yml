services:
  naviki-exporter:
    build:
      context: .
      dockerfile: Dockerfile
    image: naviki-gpx-exporter:latest
    container_name: naviki-exporter
    
    # Le .env est monté tel quel et lu par le script : passé par
    # « environment: ${VAR} », un $ dans le mot de passe était interprété
    # par compose et le mot de passe tronqué
    environment:
      - NAVIKI_CONFIG_DIR=/config
    # « z » rend les montages lisibles sous SELinux (Fedora, RHEL), sans
    # effet ailleurs. Créer .env avant le premier lancement (cp .env.example
    # .env) : sinon Docker crée un dossier .env à sa place
    volumes:
      - ./output:/output:z
      - ./.env:/config/.env:ro,z

    # Commande par défaut (à surcharger au lancement)
    # Exemple: docker compose run --rm naviki-exporter --output /output
    command: ["--help"]
    
    # Pas de restart automatique pour un script one-shot
    restart: "no"
    
    # Limites de ressources (optionnel). Le repli Firefox, utilisé si le
    # login HTTP échoue, atteint ~580 Mo : 512M provoquait un OOM kill
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M